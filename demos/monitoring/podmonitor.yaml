# spec.monitoring.enablePodMonitor is DEPRECATED as of CNPG 1.30 — the operator tells you to
# manage PodMonitors yourself. These select every CNPG instance pod in the namespace by role,
# so hafen and hafen-restored are both covered without naming either.
---
apiVersion: v1
kind: Namespace
metadata: { name: hafen }
---
apiVersion: v1
kind: Namespace
metadata: { name: hafen-dr }
---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: cnpg-instances
  namespace: hafen
  labels:
    release: kps
spec:
  selector:
    matchLabels:
      cnpg.io/podRole: instance
  podMetricsEndpoints:
  - port: metrics
    path: /metrics
    interval: 15s
---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: cnpg-instances
  namespace: hafen-dr
  labels:
    release: kps
spec:
  selector:
    matchLabels:
      cnpg.io/podRole: instance
  podMetricsEndpoints:
  - port: metrics
    path: /metrics
    interval: 15s
