<rect x="260" y="262" width="160" height="50" rx="5" fill="#0d0d0d" stroke="#5eead4" stroke-width="1.2" style="fill:rgb(13, 13, 13);stroke:rgb(94, 234, 212);color:rgb(11, 11, 11);stroke-width:1.2px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:Inter, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
