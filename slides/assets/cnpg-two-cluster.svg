<line x1="20" y1="348" x2="56" y2="348" stroke="#5eead4" stroke-width="2" style="fill:rgb(0, 0, 0);stroke:rgb(94, 234, 212);color:rgb(11, 11, 11);stroke-width:2px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:Inter, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
<text x="20" y="370" font-size="11.5" fill="#8a8a8a" style="fill:rgb(138, 138, 138);stroke:none;color:rgb(11, 11, 11);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:Inter, sans-serif;font-size:11.5px;font-weight:400;text-anchor:start;dominant-baseline:auto">S3 needs no VPN, no mesh, no cross-cluster service discovery. Egress to the bucket is the whole requirement.</text>
<text x="20" y="386" font-size="11.5" fill="#8a8a8a" style="fill:rgb(138, 138, 138);stroke:none;color:rgb(11, 11, 11);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:Inter, sans-serif;font-size:11.5px;font-weight:400;text-anchor:start;dominant-baseline:auto">Nothing coordinates the two. Promote the right side while the left still runs and both write to that bucket.</text>
</svg>