<svg width="100%" viewBox="0 0 690 402" role="img" xmlns="http://www.w3.org/2000/svg" font-family="Inter, sans-serif" style="">
<title style="fill:rgb(0, 0, 0);stroke:none;color:rgb(11, 11, 11);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:Inter, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">Disaster recovery across two Kubernetes clusters connected only by an object store</title>
<desc style="fill:rgb(0, 0, 0);stroke:none;color:rgb(11, 11, 11);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:Inter, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">Two separate Kubernetes clusters. The left one runs namespace hafen with a primary and two streaming replicas, archiving WAL to an object store. The right one runs namespace hafen-dr with two read-only instances replaying WAL from that same object store. There is no direct network path between the clusters; the lag equals archive_timeout plus upload plus poll interval.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<rect x="0" y="0" width="680" height="392" fill="#171717" style="fill:rgb(23, 23, 23);stroke:none;color:rgb(11, 11, 11);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:Inter, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>

<text x="340" y="26" text-anchor="middle" font-size="12" fill="#5eead4" style="fill:rgb(94, 234, 212);stroke:none;color:rgb(11, 11, 11);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:Inter, sans-serif;font-size:12px;font-weight:400;text-anchor:middle;dominant-baseline:auto">two operators · two control planes · no network path between them</text>
<line x1="340" y1="40" x2="340" y2="230" stroke="#5eead4" stroke-width="0.8" stroke-dasharray="4 5" opacity="0.5" style="fill:rgb(0, 0, 0);stroke:rgb(94, 234, 212);color:rgb(11, 11, 11);stroke-width:0.8px;stroke-dasharray:4px, 5px;stroke-linecap:butt;stroke-linejoin:miter;opacity:0.5;font-family:Inter, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>

<rect x="20" y="48" width="300" height="176" rx="8" fill="#2e2e2e" stroke="#4a4a4a" stroke-width="0.8" style="fill:rgb(46, 46, 46);stroke:rgb(74, 74, 74);color:rgb(11, 11, 11);stroke-width:0.8px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:Inter, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
