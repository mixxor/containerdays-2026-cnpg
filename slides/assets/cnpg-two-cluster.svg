<text x="170" y="192" text-anchor="middle" font-size="11.5" fill="#8a8a8a" style="fill:rgb(138, 138, 138);stroke:none;color:rgb(11, 11, 11);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:Inter, sans-serif;font-size:11.5px;font-weight:400;text-anchor:middle;dominant-baseline:auto">lag: milliseconds · any of these can be promoted</text>

