<text x="376" y="90" font-size="11.5" fill="#8a8a8a" style="fill:rgb(138, 138, 138);stroke:none;color:rgb(11, 11, 11);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:Inter, sans-serif;font-size:11.5px;font-weight:400;text-anchor:start;dominant-baseline:auto">namespace: hafen-dr  ·  own operator</text>

